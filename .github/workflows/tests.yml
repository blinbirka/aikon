name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Xcode ships the test frameworks, so this has to run on a macOS image
    # rather than Linux: Swift Testing and XCTest both live inside Xcode.app.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: bash scripts/bundle.sh
